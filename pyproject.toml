[project]
name = "g14lab"
version = "1.2.0"
description = "Group 14 EV battery digital-twin virtual laboratory (SOC/SOH): data-calibrated 1-RC electro-thermal twin, SOC estimators, leakage-free SOH models"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Bharathwaj Manoharan" }, { name = "Gokul Vasan R" }, { name = "Arvind Kumar" }]
dependencies = ["streamlit>=1.50,<2", "plotly>=6.0,<8", "pandas>=2.2,<4", "numpy>=2.0,<3", "scipy>=1.11,<2",
                "scikit-learn>=1.4,<2", "pyarrow>=15", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741"]   # E741: I is the conventional symbol for current

[tool.ruff.lint.isort]
known-first-party = ["g14lab"]
